allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    // Old plugins (e.g. flutter_barcode_scanner) don't declare a namespace required by AGP 8
    plugins.withId('com.android.library') {
        android {
            if (namespace == null) {
                def manifest = file('src/main/AndroidManifest.xml')
                if (manifest.exists()) {
                    namespace = new XmlSlurper().parse(manifest).@package.text() ?: project.group
                } else {
                    namespace = project.group
                }
            }
        }
    }
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
